<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f7f8fa">
  <title>应用隐私政策 | App Privacy Policies</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f7f8fa; color: #182030; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }
    main { width: min(760px, calc(100% - 32px)); margin: 48px auto; }
    h1 { margin: 0 0 8px; font-size: clamp(30px, 6vw, 42px); }
    .subtitle { margin: 0 0 32px; color: #667085; line-height: 1.7; }
    .card { display: block; padding: 24px; color: inherit; text-decoration: none; background: #fff; border: 1px solid #e4e7ec; border-radius: 20px; box-shadow: 0 10px 30px rgba(24, 32, 48, .05); transition: transform .18s ease, box-shadow .18s ease; }
    .card:hover { transform: translateY(-2px); box-shadow: 0 14px 34px rgba(24, 32, 48, .09); }
    .card h2 { margin: 0 0 6px; font-size: 22px; }
    .card p { margin: 0; color: #667085; line-height: 1.65; }
    .arrow { float: right; color: #1778fe; }
    footer { margin-top: 28px; color: #98a2b3; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <h1>应用隐私政策</h1>
    <p class="subtitle">Privacy policies for applications published by gusgnix</p>
    <a class="card" href="time-fix/">
      <span class="arrow">→</span>
      <h2>时光修复 · Time Fix</h2>
      <p>照片与视频拍摄时间、定位信息修复工具</p>
    </a>
    <footer>Last updated: October 6, 2026</footer>
  </main>
</body>
</html>
